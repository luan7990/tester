<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez Clássico JS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1e1e24;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 24px;
        }
        #turn-indicator {
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            background: #2d2d3a;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #444;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(8, 65px);
            grid-template-rows: repeat(8, 65px);
            border: 4px solid #333;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            border-radius: 4px;
            overflow: hidden;
        }
        .square {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s;
        }
